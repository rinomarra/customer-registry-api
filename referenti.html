<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Registry — Referenti</title>
<style>
  :root {
    --ground: #f7f7fb; --surface: #ffffff; --ink: #16151d; --ink-2: #55525f;
    --ink-3: #85818f; --line: #e2e0e9; --accent: #3d4fd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 1.5rem; }
  .bar { max-width: 60rem; margin: 0 auto; display: flex; align-items: center; gap: 1rem; height: 3.5rem; }
  .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 1.0625rem; }
  .logo span { color: var(--accent); }
  nav { margin-left: auto; display: flex; gap: 1.25rem; }
  nav a { color: var(--ink-2); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
  nav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
  .lede { color: var(--ink-2); margin: 0 0 2rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem; padding: 1.75rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--line); }
  th { font-size: 0.8125rem; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  td { font-size: 0.9375rem; }
  tbody tr:last-child td { border-bottom: 0; }
  .empty { color: var(--ink-3); text-align: center; padding: 2rem 0; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">Customer<span>Registry</span></div>
    <nav>
      <a href="./">Clienti</a>
      <a href="./referenti.html" aria-current="page">Referenti</a>
      <a href="./ricerca.html">Ricerca</a>
      <a href="./documentazione.html">Documentazione</a>
    </nav>
  </div>
</header>

<main>
  <h1>Referenti</h1>
  <p class="lede">Persone associate ai clienti in anagrafica. Ogni referente appartiene a un solo cliente.</p>

  <div class="card">
    <table>
      <thead>
        <tr><th>Nome</th><th>Cognome</th><th>Email</th><th>Ruolo</th><th>Cliente</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="5" class="empty">Nessun referente registrato.</td></tr>
      </tbody>
    </table>
  </div>
</main>

</body>
</html>
