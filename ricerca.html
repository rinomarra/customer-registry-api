<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Registry — Ricerca clienti</title>
<style>
  :root {
    --ground: #f7f7fb; --surface: #ffffff; --ink: #16151d; --ink-2: #55525f;
    --ink-3: #85818f; --line: #e2e0e9; --accent: #3d4fd4; --accent-dark: #33429f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 1.5rem; }
  .bar { max-width: 60rem; margin: 0 auto; display: flex; align-items: center; gap: 1rem; height: 3.5rem; }
  .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 1.0625rem; }
  .logo span { color: var(--accent); }
  nav { margin-left: auto; display: flex; gap: 1.25rem; }
  nav a { color: var(--ink-2); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
  nav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
  .lede { color: var(--ink-2); margin: 0 0 2rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem; padding: 1.75rem; }
  .row { display: grid; gap: 1.125rem; }
  @media (min-width: 40rem) { .row { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; } }
  .field { display: flex; flex-direction: column; gap: 0.375rem; }
  label { font-weight: 600; font-size: 0.875rem; }
  input, select {
    font: inherit; padding: 0.5rem 0.6875rem; border: 1px solid var(--line);
    border-radius: 0.375rem; background: #fff; color: var(--ink); width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; cursor: pointer; padding: 0.5625rem 1.25rem;
    border-radius: 0.375rem; border: 1px solid transparent; background: var(--accent); color: #fff;
  }
  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .esito { margin-top: 1.5rem; color: var(--ink-3); font-size: 0.9375rem; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">Customer<span>Registry</span></div>
    <nav>
      <a href="./">Clienti</a>
      <a href="./referenti.html">Referenti</a>
      <a href="./ricerca.html" aria-current="page">Ricerca</a>
      <a href="./documentazione.html">Documentazione</a>
    </nav>
  </div>
</header>

<main>
  <h1>Ricerca clienti</h1>
  <p class="lede">Ricerca per ragione sociale, email o partita IVA. I filtri sono combinabili.</p>

  <div class="card">
    <form class="row" onsubmit="event.preventDefault(); document.getElementById('esito').textContent = 'Nessun cliente corrisponde ai criteri indicati.';">
      <div class="field">
        <label for="q">Testo libero</label>
        <input id="q" name="q" type="text" placeholder="Ragione sociale o email">
      </div>
      <div class="field">
        <label for="partita_iva">Partita IVA</label>
        <input id="partita_iva" name="partita_iva" type="text" maxlength="11" inputmode="numeric">
      </div>
      <div class="field">
        <label for="stato">Stato</label>
        <select id="stato" name="stato">
          <option value="">Tutti</option>
          <option value="attivo">Attivo</option>
          <option value="sospeso">Sospeso</option>
        </select>
      </div>
      <button type="submit">Cerca</button>
    </form>
    <p class="esito" id="esito"></p>
  </div>
</main>

</body>
</html>
